<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Big+Shoulders+Display:wght@800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"><title>Llaves | SAE After Class</title></head><body>
<nav class="nav"><a class="brand" href="/" data-title>SAE After Class</a>
<ul><li><a class="link " href="/">Inicio</a></li><li><a class="link active" href="/bracket">Llaves</a></li><li><a class="link " href="/join">Inscripción con código</a></li></ul></nav>
<main class="page wide">
  <h1>Llaves</h1>
  <p class="lead" id="status">Cargando…</p>
  <div id="champ"></div>
  <div class="scroll"><div class="bracket" id="bracket"></div></div>
  <div id="poolWrap" class="hidden"><h2 style="font-size:2rem;margin-top:24px">Jugadores inscritos</h2><div class="chips" id="pool"></div></div>
</main>
<script src="/shared.js"></script>
<script>
async function load(){
  try{
    const s=await api('/api/state');
    renderBracket($('#bracket'),s.bracket);
    const c=champion(s.bracket);
    $('#champ').innerHTML=c?'<div class="champion">Campeón: '+esc(c)+'</div>':'';
    if(s.bracket){ $('#status').textContent='El sorteo ya se realizó. Las personas ganadoras avanzan conforme se registran los resultados.'; $('#poolWrap').classList.add('hidden'); }
    else{
      $('#status').textContent=s.players.length+' de 32 jugadores inscritos. Las llaves aparecerán cuando se realice el sorteo.';
      $('#poolWrap').classList.remove('hidden');
      $('#pool').innerHTML=s.players.map(p=>'<span class="chip">'+esc(p)+'</span>').join('')||'<span>Todavía no hay jugadores.</span>';
    }
  }catch(e){ $('#status').textContent=e.message; renderBracket($('#bracket'),null); }
}
load(); setInterval(load,10000);
</script>
</body></html>
